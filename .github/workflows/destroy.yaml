name: Destroy CloudFormation Stacks

on:
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  SECURITY_STACK: SecurityGroups-Andrey-Felipe
  EC2_STACK: EC2-Andrey-Felipe
  ALB_ASG_STACK: ALB-ASG-Andrey-Felipe
  AUTOMATION_STACK: Automation-Andrey-Felipe

jobs:
  destroy:
    name: Destroy
    runs-on: ubuntu-latest
    env:
      AWS_SESSION_TOKEN_VALUE: ${{ secrets.AWS_SESSION_TOKEN }}

    steps:
      - name: Configure AWS credentials with session token
        if: ${{ env.AWS_SESSION_TOKEN_VALUE != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ env.AWS_SESSION_TOKEN_VALUE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure AWS credentials without session token
        if: ${{ env.AWS_SESSION_TOKEN_VALUE == '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Destroy stacks in reverse order
        run: |
          set -euo pipefail

          show_stack_events() {
            local stack_name="$1"
            aws cloudformation describe-stack-events \
              --stack-name "$stack_name" \
              --query "StackEvents[0:10].[Timestamp,LogicalResourceId,ResourceStatus,ResourceStatusReason]" \
              --output table || true
          }

          delete_stack() {
            local stack_name="$1"
            local status

            status=$(aws cloudformation describe-stacks \
              --stack-name "$stack_name" \
              --query "Stacks[0].StackStatus" \
              --output text 2>/dev/null || echo "DOES_NOT_EXIST")

            if [ "$status" = "DOES_NOT_EXIST" ]; then
              echo "El stack no existe o ya fue eliminado: $stack_name"
              return 0
            fi

            echo "Eliminando stack: $stack_name (estado actual: $status)"

            if [ "$status" != "DELETE_IN_PROGRESS" ]; then
              aws cloudformation delete-stack --stack-name "$stack_name"
            fi

            aws cloudformation wait stack-delete-complete --stack-name "$stack_name" || {
              echo "Fallo la eliminacion de $stack_name. Ultimos eventos:"
              show_stack_events "$stack_name"
              exit 1
            }

            echo "Stack eliminado: $stack_name"
          }

          delete_stack "$AUTOMATION_STACK"
          delete_stack "$ALB_ASG_STACK"
          delete_stack "$EC2_STACK"
          delete_stack "$SECURITY_STACK"
