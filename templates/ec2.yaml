AWSTemplateFormatVersion: "2010-09-09"
Description: "Static EC2 stack with Amazon Linux 2023, Apache, Elastic IP, and no VPC/Subnet creation."

Parameters:
  StudentName:
    Type: String
    Default: "Andrey-Felipe-Pinto"
    Description: "Student name used to tag and name resources."

  StudentCode:
    Type: String
    Default: "192177"
    Description: "Student code used to tag resources."

  SecurityStackName:
    Type: String
    Default: "SecurityGroups-Andrey-Felipe"
    Description: "Security stack name used to import the EC2 security group."

  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: "Default subnet detected automatically by GitHub Actions."

  InstanceType:
    Type: String
    Default: "t3.micro"
    AllowedValues:
      - "t2.micro"
      - "t3.micro"
    Description: "Free Tier eligible EC2 instance type for the lab."

  LatestAmiId:
    Type: "AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>"
    Default: "/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64"
    Description: "Latest Amazon Linux 2023 AMI from SSM Parameter Store."

Resources:
  StaticEC2Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: !Ref InstanceType
      SubnetId: !Ref SubnetId
      SecurityGroupIds:
        - Fn::ImportValue:
            Fn::Sub: "${SecurityStackName}-EC2SecurityGroupId"
      UserData:
        Fn::Base64:
          Fn::Sub: |
            #!/bin/bash
            dnf update -y
            dnf install -y httpd
            systemctl enable httpd-
            systemctl start httpd

            cat > /var/www/html/index.html <<'EOF'
            <!DOCTYPE html>
            <html lang="es">
            <head>
              <meta charset="UTF-8">
              <title>EC2 estatica - ${StudentName}</title>
              <style>
                body { font-family: Arial, sans-serif; margin: 40px; background: #f6f8fa; color: #111827; }
                main { max-width: 760px; background: #ffffff; padding: 28px; border: 1px solid #d0d7de; border-radius: 8px; }
                h1 { margin-top: 0; color: #0f172a; }
              </style>
            </head>
            <body>
              <main>
                <h1>EC2 estatica funcionando</h1>
                <p>Estudiante: ${StudentName}</p>
                <p>Codigo: ${StudentCode}</p>
                <p>Esta pagina fue desplegada con AWS CloudFormation.</p>
              </main>
            </body>
            </html>
            EOF
      Tags:
        - Key: Name
          Value: !Sub "EC2-${StudentName}"
        - Key: StudentName
          Value: !Ref StudentName
        - Key: StudentCode
          Value: !Ref StudentCode
        - Key: Project
          Value: "CloudComputingFinal"
        - Key: ManagedBy
          Value: "CloudFormation"

  StaticElasticIP:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub "EIP-EC2-${StudentName}"
        - Key: StudentName
          Value: !Ref StudentName
        - Key: StudentCode
          Value: !Ref StudentCode
        - Key: Project
          Value: "CloudComputingFinal"
        - Key: ManagedBy
          Value: "CloudFormation"

  StaticElasticIPAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      AllocationId: !GetAtt StaticElasticIP.AllocationId
      InstanceId: !Ref StaticEC2Instance

Outputs:
  InstanceId:
    Description: "Static EC2 instance ID."
    Value: !Ref StaticEC2Instance
    Export:
      Name: !Sub "${AWS::StackName}-InstanceId"

  ElasticIP:
    Description: "Elastic IP associated with the static EC2 instance."
    Value: !Ref StaticElasticIP
    Export:
      Name: !Sub "${AWS::StackName}-ElasticIP"

  WebsiteURL:
    Description: "Public website URL served by Apache."
    Value: !Sub "http://${StaticElasticIP}"
    Export:
      Name: !Sub "${AWS::StackName}-WebsiteURL"

  EC2StackName:
    Description: "EC2 stack name."
    Value: !Ref AWS::StackName
    Export:
      Name: !Sub "${AWS::StackName}-EC2StackName"
