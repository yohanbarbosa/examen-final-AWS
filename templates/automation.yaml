AWSTemplateFormatVersion: "2010-09-09"
Description: "Automation stack with scheduled scaling actions and Launch Template version 2 custom resource."

Parameters:
  StudentName:
    Type: String
    Default: "Andrey-Felipe-Pinto"
    Description: "Student name used to tag and name resources."

  StudentCode:
    Type: String
    Default: "192177"
    Description: "Student code used to tag resources."

  ALBASGStackName:
    Type: String
    Default: "ALB-ASG-Andrey-Felipe"
    Description: "ALB-ASG stack name used to import the Launch Template and Auto Scaling Group."

Resources:
  ScaleOutMorning:
    Type: AWS::AutoScaling::ScheduledAction
    Properties:
      AutoScalingGroupName:
        Fn::ImportValue:
          Fn::Sub: "${ALBASGStackName}-AutoScalingGroupName"
      ScheduledActionName: !Sub "ScaleOut-Morning-${StudentName}"
      Recurrence: "0 13 * * MON-FRI"
      MinSize: 1
      MaxSize: 3
      DesiredCapacity: 2

  ScaleOutAfternoon:
    Type: AWS::AutoScaling::ScheduledAction
    Properties:
      AutoScalingGroupName:
        Fn::ImportValue:
          Fn::Sub: "${ALBASGStackName}-AutoScalingGroupName"
      ScheduledActionName: !Sub "ScaleOut-Afternoon-${StudentName}"
      Recurrence: "0 19 * * MON-FRI"
      MinSize: 1
      MaxSize: 3
      DesiredCapacity: 3

  ScaleInNoon:
    Type: AWS::AutoScaling::ScheduledAction
    Properties:
      AutoScalingGroupName:
        Fn::ImportValue:
          Fn::Sub: "${ALBASGStackName}-AutoScalingGroupName"
      ScheduledActionName: !Sub "ScaleIn-Noon-${StudentName}"
      Recurrence: "0 17 * * MON-FRI"
      MinSize: 1
      MaxSize: 3
      DesiredCapacity: 1

  ScaleInNight:
    Type: AWS::AutoScaling::ScheduledAction
    Properties:
      AutoScalingGroupName:
        Fn::ImportValue:
          Fn::Sub: "${ALBASGStackName}-AutoScalingGroupName"
      ScheduledActionName: !Sub "ScaleIn-Night-${StudentName}"
      Recurrence: "0 23 * * MON-FRI"
      MinSize: 1
      MaxSize: 3
      DesiredCapacity: 1

  LaunchTemplateVersionUpdaterRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "Role-LT-V2-${StudentName}-${AWS::Region}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: "sts:AssumeRole"
      Policies:
        - PolicyName: "LaunchTemplateVersionUpdaterPolicy"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: "DescribeLaunchTemplatesAndAutoScaling"
                Effect: Allow
                Action:
                  - "ec2:DescribeLaunchTemplateVersions"
                  - "ec2:DescribeLaunchTemplates"
                  - "autoscaling:DescribeAutoScalingGroups"
                Resource: "*"
              - Sid: "ManageImportedLaunchTemplate"
                Effect: Allow
                Action:
                  - "ec2:CreateLaunchTemplateVersion"
                  - "ec2:ModifyLaunchTemplate"
                Resource:
                  Fn::Sub:
                    - "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:launch-template/${LaunchTemplateId}"
                    - LaunchTemplateId:
                        Fn::ImportValue:
                          Fn::Sub: "${ALBASGStackName}-LaunchTemplateId"
              - Sid: "UpdateImportedAutoScalingGroup"
                Effect: Allow
                Action:
                  - "autoscaling:UpdateAutoScalingGroup"
                Resource:
                  Fn::Sub:
                    - "arn:${AWS::Partition}:autoscaling:${AWS::Region}:${AWS::AccountId}:autoScalingGroup:*:autoScalingGroupName/${AutoScalingGroupName}"
                    - AutoScalingGroupName:
                        Fn::ImportValue:
                          Fn::Sub: "${ALBASGStackName}-AutoScalingGroupName"
              - Sid: "WriteLambdaLogs"
                Effect: Allow
                Action:
                  - "logs:CreateLogGroup"
                  - "logs:CreateLogStream"
                  - "logs:PutLogEvents"
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:*"
      Tags:
        - Key: StudentName
          Value: !Ref StudentName
        - Key: StudentCode
          Value: !Ref StudentCode
        - Key: Project
          Value: "CloudComputingFinal"
        - Key: ManagedBy
          Value: "CloudFormation"

  LaunchTemplateVersionUpdaterFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "LT-V2-Updater-${StudentName}"
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt LaunchTemplateVersionUpdaterRole.Arn
      Timeout: 60
      Code:
        ZipFile: |
          import base64
          import json
          import urllib.request
          import boto3

          def respond(event, context, status, data, physical_id=None, reason=None):
              body = {
                  "Status": status,
                  "Reason": reason or "See CloudWatch Logs: " + context.log_stream_name,
                  "PhysicalResourceId": physical_id or context.log_stream_name,
                  "StackId": event["StackId"],
                  "RequestId": event["RequestId"],
                  "LogicalResourceId": event["LogicalResourceId"],
                  "Data": data,
              }
              payload = json.dumps(body).encode("utf-8")
              req = urllib.request.Request(
                  event["ResponseURL"],
                  data=payload,
                  method="PUT",
                  headers={"content-type": "", "content-length": str(len(payload))},
              )
              urllib.request.urlopen(req)

          def handler(event, context):
              try:
                  props = event["ResourceProperties"]
                  launch_template_id = props["LaunchTemplateId"]
                  auto_scaling_group_name = props["AutoScalingGroupName"]

                  if event["RequestType"] == "Delete":
                      respond(event, context, "SUCCESS", {"Message": "No delete action required"}, event.get("PhysicalResourceId"))
                      return

                  ec2 = boto3.client("ec2")
                  autoscaling = boto3.client("autoscaling")
                  result = ec2.create_launch_template_version(
                      LaunchTemplateId=launch_template_id,
                      SourceVersion="$Latest",
                      VersionDescription=props.get("VersionDescription", "Version 2 created by CloudFormation"),
                      LaunchTemplateData={"UserData": props["UserData"]},
                  )
                  version_number = str(result["LaunchTemplateVersion"]["VersionNumber"])
                  ec2.modify_launch_template(LaunchTemplateId=launch_template_id, DefaultVersion=version_number)
                  autoscaling.update_auto_scaling_group(
                      AutoScalingGroupName=auto_scaling_group_name,
                      LaunchTemplate={"LaunchTemplateId": launch_template_id, "Version": version_number},
                  )
                  respond(
                      event,
                      context,
                      "SUCCESS",
                      {
                          "VersionNumber": version_number,
                          "LaunchTemplateId": launch_template_id,
                          "AutoScalingGroupName": auto_scaling_group_name,
                      },
                      launch_template_id + "-" + version_number,
                  )
              except Exception as exc:
                  respond(event, context, "FAILED", {}, reason=str(exc))
      Tags:
        - Key: StudentName
          Value: !Ref StudentName
        - Key: StudentCode
          Value: !Ref StudentCode
        - Key: Project
          Value: "CloudComputingFinal"
        - Key: ManagedBy
          Value: "CloudFormation"

  LaunchTemplateVersion2:
    Type: Custom::LaunchTemplateVersionUpdater
    Properties:
      ServiceToken: !GetAtt LaunchTemplateVersionUpdaterFunction.Arn
      LaunchTemplateId:
        Fn::ImportValue:
          Fn::Sub: "${ALBASGStackName}-LaunchTemplateId"
      AutoScalingGroupName:
        Fn::ImportValue:
          Fn::Sub: "${ALBASGStackName}-AutoScalingGroupName"
      VersionDescription: !Sub "Version 2 - Apache page updated by Automation stack - ${StudentName}"
      UserData:
        Fn::Base64:
          Fn::Sub: |
            #!/bin/bash
            dnf update -y
            dnf install -y httpd
            systemctl enable httpd
            systemctl start httpd
            TOKEN=$(curl -X PUT "http://169.254.169.254/latest/api/token" -H "X-aws-ec2-metadata-token-ttl-seconds: 21600" -s)
            INSTANCE_ID=$(curl -H "X-aws-ec2-metadata-token: $TOKEN" -s http://169.254.169.254/latest/meta-data/instance-id)
            cat > /var/www/html/index.html <<EOF
            <!DOCTYPE html>
            <html lang="es">
            <head>
              <meta charset="UTF-8">
              <title>Launch Template V2 - ${StudentName}</title>
              <style>
                body { font-family: Arial, sans-serif; margin: 40px; background: #f0fdf4; color: #111827; }
                main { max-width: 760px; background: #ffffff; padding: 28px; border: 1px solid #bbf7d0; border-radius: 8px; }
                h1 { margin-top: 0; color: #14532d; }
              </style>
            </head>
            <body>
              <main>
                <h1>Aplicacion web version 2</h1>
                <p>Estudiante: ${StudentName}</p>
                <p>Codigo: ${StudentCode}</p>
                <p>Instancia: $INSTANCE_ID</p>
                <p>Esta version fue creada por el stack Automation usando CloudFormation.</p>
              </main>
            </body>
            </html>
            EOF

Outputs:
  ScheduledActionScaleOutMorning:
    Description: "First scale-out scheduled action."
    Value: !Ref ScaleOutMorning

  ScheduledActionScaleOutAfternoon:
    Description: "Second scale-out scheduled action."
    Value: !Ref ScaleOutAfternoon

  ScheduledActionScaleInNoon:
    Description: "First scale-in scheduled action."
    Value: !Ref ScaleInNoon

  ScheduledActionScaleInNight:
    Description: "Second scale-in scheduled action."
    Value: !Ref ScaleInNight

  LaunchTemplateVersion2Number:
    Description: "Launch Template version number created by the Automation stack."
    Value: !GetAtt LaunchTemplateVersion2.VersionNumber

  LaunchTemplateId:
    Description: "Imported Launch Template ID updated by the custom resource."
    Value: !GetAtt LaunchTemplateVersion2.LaunchTemplateId

  AutoScalingGroupUpdated:
    Description: "Auto Scaling Group updated to use the new Launch Template version."
    Value: !GetAtt LaunchTemplateVersion2.AutoScalingGroupName

  AutomationStackName:
    Description: "Automation stack name."
    Value: !Ref AWS::StackName
