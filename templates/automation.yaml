AWSTemplateFormatVersion: "2010-09-09"
Description: "Stack 4 - Scheduled Actions, version 2 del Launch Template y actualizacion del Auto Scaling Group."

Parameters:
  StudentName:
    Type: String
    Default: "Andrey-Felipe-Pinto"
    Description: "Nombre usado para identificar los recursos."

  ALBASGStackName:
    Type: String
    Default: "ALB-ASG-Andrey-Felipe"
    Description: "Nombre del stack ALB-ASG para importar Launch Template y Auto Scaling Group."

Resources:
  ScaleOutMorning:
    Type: AWS::AutoScaling::ScheduledAction
    Properties:
      AutoScalingGroupName:
        Fn::ImportValue:
          Fn::Sub: "${ALBASGStackName}-AutoScalingGroupName"
      ScheduledActionName:
        Fn::Sub: "ScaleOut-Morning-${StudentName}"
      Recurrence: "0 13 * * MON-FRI"
      MinSize: 2
      MaxSize: 4
      DesiredCapacity: 2

  ScaleOutAfternoon:
    Type: AWS::AutoScaling::ScheduledAction
    Properties:
      AutoScalingGroupName:
        Fn::ImportValue:
          Fn::Sub: "${ALBASGStackName}-AutoScalingGroupName"
      ScheduledActionName:
        Fn::Sub: "ScaleOut-Afternoon-${StudentName}"
      Recurrence: "0 19 * * MON-FRI"
      MinSize: 3
      MaxSize: 4
      DesiredCapacity: 3

  ScaleInNoon:
    Type: AWS::AutoScaling::ScheduledAction
    Properties:
      AutoScalingGroupName:
        Fn::ImportValue:
          Fn::Sub: "${ALBASGStackName}-AutoScalingGroupName"
      ScheduledActionName:
        Fn::Sub: "ScaleIn-Noon-${StudentName}"
      Recurrence: "0 17 * * MON-FRI"
      MinSize: 1
      MaxSize: 3
      DesiredCapacity: 1

  ScaleInNight:
    Type: AWS::AutoScaling::ScheduledAction
    Properties:
      AutoScalingGroupName:
        Fn::ImportValue:
          Fn::Sub: "${ALBASGStackName}-AutoScalingGroupName"
      ScheduledActionName:
        Fn::Sub: "ScaleIn-Night-${StudentName}"
      Recurrence: "0 23 * * MON-FRI"
      MinSize: 1
      MaxSize: 3
      DesiredCapacity: 1

  LaunchTemplateVersionUpdaterRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName:
        Fn::Sub: "Role-LT-V2-${StudentName}-${AWS::Region}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: "sts:AssumeRole"
      Policies:
        - PolicyName: "LaunchTemplateVersionUpdaterPolicy"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - "ec2:CreateLaunchTemplateVersion"
                  - "ec2:ModifyLaunchTemplate"
                  - "ec2:DescribeLaunchTemplateVersions"
                  - "ec2:DescribeLaunchTemplates"
                  - "autoscaling:UpdateAutoScalingGroup"
                  - "autoscaling:DescribeAutoScalingGroups"
                Resource: "*"
              - Effect: Allow
                Action:
                  - "logs:CreateLogGroup"
                  - "logs:CreateLogStream"
                  - "logs:PutLogEvents"
                Resource: "*"

  LaunchTemplateVersionUpdaterFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName:
        Fn::Sub: "LT-V2-Updater-${StudentName}"
      Runtime: python3.12
      Handler: index.handler
      Role:
        Fn::GetAtt:
          - LaunchTemplateVersionUpdaterRole
          - Arn
      Timeout: 60
      Code:
        ZipFile: |
          import json,boto3,urllib3
          http=urllib3.PoolManager()
          def respond(e,c,status,data,phys=None,reason=None):
              body={"Status":status,"Reason":reason or "Ver logs: "+c.log_stream_name,
                    "PhysicalResourceId":phys or c.log_stream_name,"StackId":e["StackId"],
                    "RequestId":e["RequestId"],"LogicalResourceId":e["LogicalResourceId"],
                    "Data":data}
              http.request("PUT",e["ResponseURL"],body=json.dumps(body).encode(),
                           headers={"content-type":"","content-length":str(len(json.dumps(body)))})
          def handler(event,context):
              try:
                  p=event["ResourceProperties"]
                  lt=p["LaunchTemplateId"]
                  asg=p["AutoScalingGroupName"]
                  if event["RequestType"]=="Delete":
                      respond(event,context,"SUCCESS",{"Message":"Sin accion en delete"},event.get("PhysicalResourceId"))
                      return
                  ec2=boto3.client("ec2")
                  au=boto3.client("autoscaling")
                  r=ec2.create_launch_template_version(
                      LaunchTemplateId=lt,SourceVersion="$Latest",
                      VersionDescription=p.get("VersionDescription","Version 2 CloudFormation"),
                      LaunchTemplateData={"UserData":p["UserData"]})
                  v=str(r["LaunchTemplateVersion"]["VersionNumber"])
                  ec2.modify_launch_template(LaunchTemplateId=lt,DefaultVersion=v)
                  au.update_auto_scaling_group(AutoScalingGroupName=asg,
                      LaunchTemplate={"LaunchTemplateId":lt,"Version":v})
                  respond(event,context,"SUCCESS",
                      {"VersionNumber":v,"LaunchTemplateId":lt,"AutoScalingGroupName":asg},
                      lt+"-"+v)
              except Exception as ex:
                  respond(event,context,"FAILED",{},reason=str(ex))

  LaunchTemplateVersion2:
    Type: Custom::LaunchTemplateVersionUpdater
    Properties:
      ServiceToken:
        Fn::GetAtt:
          - LaunchTemplateVersionUpdaterFunction
          - Arn
      LaunchTemplateId:
        Fn::ImportValue:
          Fn::Sub: "${ALBASGStackName}-LaunchTemplateId"
      AutoScalingGroupName:
        Fn::ImportValue:
          Fn::Sub: "${ALBASGStackName}-AutoScalingGroupName"
      VersionDescription:
        Fn::Sub: "Version 2 - Actualizacion controlada - ${StudentName}"
      UserData:
        Fn::Base64:
          Fn::Sub: |
            #!/bin/bash
            dnf update -y
            dnf install -y httpd
            systemctl enable httpd
            systemctl start httpd
            INSTANCE_ID=$(curl -s http://169.254.169.254/latest/meta-data/instance-id)
            cat > /var/www/html/index.html <<EOF
            <!DOCTYPE html>
            <html lang="es">
            <head>
              <meta charset="UTF-8">
              <title>Launch Template V2 - ${StudentName}</title>
              <style>
                body { font-family: Arial, sans-serif; margin: 40px; background: #f0fdf4; }
                .card { background: white; padding: 24px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.12); }
                h1 { color: #14532d; }
              </style>
            </head>
            <body>
              <div class="card">
                <h1>Aplicacion web version 2</h1>
                <p>Estudiante: ${StudentName}</p>
                <p>Instancia nueva desplegada con Launch Template Version 2.</p>
                <p>Instancia: $INSTANCE_ID</p>
              </div>
            </body>
            </html>
            EOF

Outputs:
  ScheduledActionScaleOutMorning:
    Description: "Accion programada de incremento 1"
    Value:
      Ref: ScaleOutMorning

  ScheduledActionScaleOutAfternoon:
    Description: "Accion programada de incremento 2"
    Value:
      Ref: ScaleOutAfternoon

  ScheduledActionScaleInNoon:
    Description: "Accion programada de reduccion 1"
    Value:
      Ref: ScaleInNoon

  ScheduledActionScaleInNight:
    Description: "Accion programada de reduccion 2"
    Value:
      Ref: ScaleInNight

  LaunchTemplateVersion2Number:
    Description: "Numero de la version 2 creada para el Launch Template"
    Value:
      Fn::GetAtt:
        - LaunchTemplateVersion2
        - VersionNumber

  LaunchTemplateId:
    Description: "Launch Template actualizado"
    Value:
      Fn::GetAtt:
        - LaunchTemplateVersion2
        - LaunchTemplateId

  AutoScalingGroupUpdated:
    Description: "Auto Scaling Group actualizado para usar la nueva version"
    Value:
      Fn::GetAtt:
        - LaunchTemplateVersion2
        - AutoScalingGroupName

  AutomationStackName:
    Description: "Nombre del stack Automation"
    Value:
      Ref: AWS::StackName
