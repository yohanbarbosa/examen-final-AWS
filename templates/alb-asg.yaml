AWSTemplateFormatVersion: "2010-09-09"
Description: "ALB-ASG stack with Application Load Balancer, Target Group, Launch Template, Auto Scaling Group, and Warm Pool."

Parameters:
  StudentName:
    Type: String
    Default: "Andrey-Felipe-Pinto"
    Description: "Student name used to tag and name resources."

  StudentCode:
    Type: String
    Default: "192177"
    Description: "Student code used to tag resources."

  SecurityStackName:
    Type: String
    Default: "SecurityGroups-Andrey-Felipe"
    Description: "Security stack name used to import EC2 and ALB security groups."

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: "Default VPC detected automatically by GitHub Actions."

  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: "Default subnets detected automatically by GitHub Actions."

  InstanceType:
    Type: String
    Default: "t2.micro"
    AllowedValues:
      - "t2.micro"
      - "t3.micro"
      - "t3.small"
    Description: "EC2 instance type for the Auto Scaling Group."

  LatestAmiId:
    Type: "AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>"
    Default: "/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64"
    Description: "Latest Amazon Linux 2023 AMI from SSM Parameter Store."

Resources:
  WebLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Sub "LT-${StudentName}"
      VersionDescription: "Version 1 - Initial Apache page"
      LaunchTemplateData:
        ImageId: !Ref LatestAmiId
        InstanceType: !Ref InstanceType
        SecurityGroupIds:
          - Fn::ImportValue:
              Fn::Sub: "${SecurityStackName}-EC2SecurityGroupId"
        UserData:
          Fn::Base64:
            Fn::Sub: |
              #!/bin/bash
              dnf update -y
              dnf install -y httpd
              systemctl enable httpd
              systemctl start httpd
              TOKEN=$(curl -X PUT "http://169.254.169.254/latest/api/token" -H "X-aws-ec2-metadata-token-ttl-seconds: 21600" -s)
              INSTANCE_ID=$(curl -H "X-aws-ec2-metadata-token: $TOKEN" -s http://169.254.169.254/latest/meta-data/instance-id)
              cat > /var/www/html/index.html <<EOF
              <!DOCTYPE html>
              <html lang="es">
              <head>
                <meta charset="UTF-8">
                <title>ALB ASG - ${StudentName}</title>
                <style>
                  body { font-family: Arial, sans-serif; margin: 40px; background: #eef6ff; color: #111827; }
                  main { max-width: 760px; background: #ffffff; padding: 28px; border: 1px solid #bfdbfe; border-radius: 8px; }
                  h1 { margin-top: 0; color: #0f172a; }
                </style>
              </head>
              <body>
                <main>
                  <h1>Aplicacion web version 1</h1>
                  <p>Estudiante: ${StudentName}</p>
                  <p>Codigo: ${StudentCode}</p>
                  <p>Instancia: $INSTANCE_ID</p>
                  <p>Infraestructura desplegada con ALB, Target Group, Launch Template, ASG y Warm Pool.</p>
                </main>
              </body>
              </html>
              EOF
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - Key: Name
                Value: !Sub "ASG-Instance-${StudentName}"
              - Key: StudentName
                Value: !Ref StudentName
              - Key: StudentCode
                Value: !Ref StudentCode
              - Key: Project
                Value: "CloudComputingFinal"
              - Key: ManagedBy
                Value: "CloudFormation"
          - ResourceType: volume
            Tags:
              - Key: Name
                Value: !Sub "ASG-Volume-${StudentName}"
              - Key: StudentName
                Value: !Ref StudentName
              - Key: StudentCode
                Value: !Ref StudentCode
              - Key: Project
                Value: "CloudComputingFinal"
              - Key: ManagedBy
                Value: "CloudFormation"
      TagSpecifications:
        - ResourceType: launch-template
          Tags:
            - Key: Name
              Value: !Sub "LT-${StudentName}"
            - Key: StudentName
              Value: !Ref StudentName
            - Key: StudentCode
              Value: !Ref StudentCode
            - Key: Project
              Value: "CloudComputingFinal"
            - Key: ManagedBy
              Value: "CloudFormation"

  WebTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub "TG-${AWS::StackName}"
      Port: 80
      Protocol: HTTP
      TargetType: instance
      VpcId: !Ref VpcId
      HealthCheckEnabled: true
      HealthCheckPath: "/"
      HealthCheckProtocol: HTTP
      HealthCheckPort: "traffic-port"
      Matcher:
        HttpCode: "200"
      Tags:
        - Key: Name
          Value: !Sub "TG-${StudentName}"
        - Key: StudentName
          Value: !Ref StudentName
        - Key: StudentCode
          Value: !Ref StudentCode
        - Key: Project
          Value: "CloudComputingFinal"
        - Key: ManagedBy
          Value: "CloudFormation"

  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub "ALB-${StudentName}"
      Scheme: internet-facing
      Type: application
      IpAddressType: ipv4
      SecurityGroups:
        - Fn::ImportValue:
            Fn::Sub: "${SecurityStackName}-ALBSecurityGroupId"
      Subnets: !Ref SubnetIds
      Tags:
        - Key: Name
          Value: !Sub "ALB-${StudentName}"
        - Key: StudentName
          Value: !Ref StudentName
        - Key: StudentCode
          Value: !Ref StudentCode
        - Key: Project
          Value: "CloudComputingFinal"
        - Key: ManagedBy
          Value: "CloudFormation"

  ALBListenerHTTP:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref WebTargetGroup

  WebAutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      AutoScalingGroupName: !Sub "ASG-${StudentName}"
      MinSize: "1"
      MaxSize: "3"
      DesiredCapacity: "1"
      HealthCheckType: ELB
      HealthCheckGracePeriod: 120
      VPCZoneIdentifier: !Ref SubnetIds
      TargetGroupARNs:
        - !Ref WebTargetGroup
      LaunchTemplate:
        LaunchTemplateId: !Ref WebLaunchTemplate
        Version: !GetAtt WebLaunchTemplate.LatestVersionNumber
      Tags:
        - Key: Name
          Value: !Sub "ASG-Instance-${StudentName}"
          PropagateAtLaunch: true
        - Key: StudentName
          Value: !Ref StudentName
          PropagateAtLaunch: true
        - Key: StudentCode
          Value: !Ref StudentCode
          PropagateAtLaunch: true
        - Key: Project
          Value: "CloudComputingFinal"
          PropagateAtLaunch: true
        - Key: ManagedBy
          Value: "CloudFormation"
          PropagateAtLaunch: true
    UpdatePolicy:
      AutoScalingRollingUpdate:
        MinInstancesInService: 1
        MaxBatchSize: 1
        PauseTime: "PT2M"
        WaitOnResourceSignals: false

  WebWarmPool:
    Type: AWS::AutoScaling::WarmPool
    Properties:
      AutoScalingGroupName: !Ref WebAutoScalingGroup
      PoolState: Stopped
      MinSize: 1
      MaxGroupPreparedCapacity: 2

Outputs:
  LoadBalancerDNS:
    Description: "Public DNS name of the Application Load Balancer."
    Value: !GetAtt ApplicationLoadBalancer.DNSName
    Export:
      Name: !Sub "${AWS::StackName}-LoadBalancerDNS"

  LoadBalancerURL:
    Description: "Public URL of the Application Load Balancer."
    Value: !Sub "http://${ApplicationLoadBalancer.DNSName}"
    Export:
      Name: !Sub "${AWS::StackName}-LoadBalancerURL"

  TargetGroupArn:
    Description: "Target Group ARN."
    Value: !Ref WebTargetGroup
    Export:
      Name: !Sub "${AWS::StackName}-TargetGroupArn"

  LaunchTemplateId:
    Description: "Launch Template ID."
    Value: !Ref WebLaunchTemplate
    Export:
      Name: !Sub "${AWS::StackName}-LaunchTemplateId"

  LaunchTemplateLatestVersion:
    Description: "Latest Launch Template version number."
    Value: !GetAtt WebLaunchTemplate.LatestVersionNumber
    Export:
      Name: !Sub "${AWS::StackName}-LaunchTemplateLatestVersion"

  AutoScalingGroupName:
    Description: "Auto Scaling Group name."
    Value: !Ref WebAutoScalingGroup
    Export:
      Name: !Sub "${AWS::StackName}-AutoScalingGroupName"

  ALBASGStackName:
    Description: "ALB-ASG stack name."
    Value: !Ref AWS::StackName
